# /etc/nginx/conf.d/frostwit-zones.conf (http context). IPs live only in nginx memory for rate limiting; the access log has no address.
limit_req_zone $binary_remote_addr zone=fw_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=fw_poll:10m rate=90r/m;
limit_req_zone $binary_remote_addr zone=fw_og:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=fw_metric:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=fw_page:10m rate=300r/m;
log_format fw_noip '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';
