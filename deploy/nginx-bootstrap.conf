# Port 80 only: used once to obtain the certificate (webroot challenge), then replaced by nginx-frostwit.conf.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 404; }
}
