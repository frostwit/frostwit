# /etc/nginx/sites-available/frostwit: __DOMAIN__ + www.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.__DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log off;
    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/frostwit.access.log fw_noip;
    error_log /var/log/nginx/frostwit.error.log crit;
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml text/plain text/markdown;
    client_max_body_size 4k;
    limit_req_status 429;

    set $upstream http://127.0.0.1:__PORT__;

    location = /api/metric {
        limit_req zone=fw_metric burst=5 nodelay;
        include /etc/nginx/snippets/frostwit-headers.conf;
        proxy_pass $upstream; proxy_http_version 1.1; proxy_set_header Connection "";
    }
    # case polling (every 2 s while tracing) has its own, wider zone
    location ~ "^/api/case/[0-9a-f]{12}$" {
        limit_req zone=fw_poll burst=40 nodelay;
        include /etc/nginx/snippets/frostwit-headers.conf;
        proxy_pass $upstream; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 20s;
    }
    location /api/ {
        limit_req zone=fw_api burst=20 nodelay;
        include /etc/nginx/snippets/frostwit-headers.conf;
        proxy_pass $upstream; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 30s;
    }
    location = /api {
        limit_req zone=fw_api burst=20 nodelay;
        include /etc/nginx/snippets/frostwit-headers.conf;
        proxy_pass $upstream; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ~ ^/(og|img)/ {
        limit_req zone=fw_og burst=10 nodelay;
        include /etc/nginx/snippets/frostwit-headers.conf;
        proxy_pass $upstream; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_read_timeout 30s;
    }
    location = /token.json {
        include /etc/nginx/snippets/frostwit-headers.conf;
        add_header Cache-Control "no-cache" always;
        proxy_pass $upstream; proxy_http_version 1.1; proxy_set_header Connection "";
    }
    location /dist/ {
        include /etc/nginx/snippets/frostwit-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        alias /opt/frostwit/repo/web/dist/;
        try_files $uri =404;
    }
    location / {
        limit_req zone=fw_page burst=60 nodelay;
        include /etc/nginx/snippets/frostwit-headers.conf;
        proxy_pass $upstream; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 20s;
    }
}
